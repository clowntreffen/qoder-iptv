<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HLS local stream test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/node_modules/hls.js/dist/hls.min.js"></script>
<style>
  body { background:#0d1117; color:#e6edf3; font:16px/1.5 system-ui,sans-serif; margin:0; padding:24px; }
  video { width:min(960px,100%); background:#000; aspect-ratio:16/9; }
  #log { white-space:pre-wrap; font-family:ui-monospace,monospace; font-size:13px; color:#9da7b3; max-width:960px; }
  .err { color:#ff7b72; }
  .ok { color:#7ee787; }
</style>
</head>
<body>
<h1>Local HLS test</h1>
<video id="video" controls autoplay muted playsinline></video>
<div id="status">loading…</div>
<div id="log"></div>
<script>
const params = new URLSearchParams(location.search);
const url = params.get('url') || '/test/streams/output/live.m3u8';
const video = document.getElementById('video');
const status = document.getElementById('status');
const logEl = document.getElementById('log');

function say(text, cls) {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = new Date().toLocaleTimeString() + ' ' + text;
  logEl.prepend(line);
}

say('stream: ' + url);
if (window.Hls && Hls.isSupported()) {
  const hls = new Hls({ debug: false });
  hls.loadSource(url);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, () => say('manifest parsed', 'ok'));
  hls.on(Hls.Events.LEVEL_LOADED, (_e, d) => {
    status.textContent = 'playing ' + (d && d.details && d.details.live ? '(live)' : '') +
      ' level=' + (hls.currentLevel >= 0 ? hls.currentLevel : 'auto');
  });
  hls.on(Hls.Events.ERROR, (_e, data) => {
    say('error: ' + data.type + '/' + data.details + ' fatal=' + !!data.fatal, 'err');
  });
} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
  video.src = url;
  say('native HLS path');
} else {
  say('HLS not supported in this browser', 'err');
}
video.addEventListener('playing', () => { status.textContent = 'playing'; say('playing', 'ok'); });
video.addEventListener('waiting', () => { status.textContent = 'buffering…'; });
video.addEventListener('error', () => {
  say('video error ' + ((video.error && video.error.code) || '?'), 'err');
});
</script>
</body>
</html>
