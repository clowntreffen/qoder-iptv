<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Qoder IPTV</title>
  <link rel="stylesheet" href="./src/styles/main.css" />
</head>
<body>
  <div id="app">
    <!-- player layer: fullscreen video -->
    <div id="player-layer">
      <video id="video" playsinline preload="auto"></video>
    </div>

    <!-- \u6362\u53f0 OSD \u4fe1\u606f\u6761 -->
    <div id="osd" class="osd hidden"></div>

    <!-- cross-group zap notice, shown above the OSD -->
    <div id="group-hint" class="group-hint hidden"></div>

    <!-- catch-up bar: progress bar + speed -->
    <div id="catchup-bar" class="catchup-bar hidden"></div>

    <!-- \u56de\u770b\u975e 1× \u65f6\u7684\u5e38\u9a7b\u500d\u901f\u89d2\u6807 -->
    <div id="speed-badge" class="speed-badge hidden"></div>

    <!-- \u6570\u5b57\u6362\u53f0\u7f13\u51b2 -->
    <div id="channel-input" class="channel-input hidden"></div>

    <!-- bottom-right net speed, always on after enabling it in settings -->
    <div id="net-speed" class="net-speed hidden"></div>

    <!-- \u9876\u90e8\u72b6\u6001\u680f -->
    <div id="status-bar" class="status-bar hidden"></div>

    <!-- \u4e09\u680f\u547c\u51fa\u83dc\u5355 -->
    <div id="channel-menu" class="overlay hidden"></div>

    <!-- per-channel editor: rename / hide / group / order / EPG offset -->
    <div id="channel-editor" class="overlay hidden"></div>

    <!-- \u5168\u5c4f EPG \u8282\u76ee\u6307\u5357 -->
    <div id="epg-guide" class="overlay hidden"></div>

    <!-- \u8bbe\u7f6e\u83dc\u5355 -->
    <div id="settings" class="overlay hidden"></div>

    <!-- \u6e90\u7ba1\u7406 -->
    <div id="source-manager" class="overlay hidden"></div>

    <!-- \u5206\u7ec4\u663e\u793a\u7ba1\u7406 -->
    <div id="group-manager" class="overlay hidden"></div>

    <!-- player tuning (on-device) -->
    <div id="player-tuning" class="overlay hidden"></div>

    <!-- \u8bbe\u5907\u4fe1\u606f -->
    <div id="device-info" class="overlay hidden"></div>

    <!-- \u9891\u9053\u641c\u7d22 -->
    <div id="search" class="overlay hidden"></div>

    <!-- \u5907\u4efd / \u6062\u590d -->
    <div id="backup-dialog" class="overlay hidden"></div>

    <!-- PIN \u8f93\u5165 -->
    <div id="pin-entry" class="overlay hidden"></div>

    <!-- \u56de\u770b\u7eed\u64ad\u63d0\u793a -->
    <div id="resume-prompt" class="overlay hidden"></div>

    <!-- \u9000\u51fa\u786e\u8ba4\u5bf9\u8bdd\u6846 -->
    <div id="exit-dialog" class="overlay hidden"></div>

    <!-- \u5168\u5c40\u63d0\u793a toast -->
    <div id="toast" class="toast hidden"></div>

    <!-- \u52a0\u8f7d\u4e2d -->
    <div id="loading" class="loading hidden"><div class="spinner"></div></div>
  </div>

  <!-- boot diagnostics: inline styles + plain ES5 script, so it still shows when the module bundle fails and avoids a pure black screen -->
  <div id="boot-diag" style="position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483647;pointer-events:none;color:#fff;font-family:sans-serif;">
    <div id="boot-diag-box" style="position:absolute;left:4%;top:6%;max-width:88%;background:rgba(0,0,0,0.8);border-radius:8px;white-space:pre-wrap;word-break:break-all;line-height:1.5;"></div>
  </div>
  <script>
    (function () {
      var root = document.getElementById('boot-diag');
      var box = document.getElementById('boot-diag-box');
      var lines = [];
      var errors = 0;
      var started = false;
      function size() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080) || 1;
        box.style.fontSize = Math.max(14, Math.round(26 * s)) + 'px';
        box.style.padding = Math.round(20 * s) + 'px ' + Math.round(28 * s) + 'px';
      }
      function add(text) {
        lines.push(text);
        box.textContent = lines.join('\n');
      }
      function remove() {
        window.removeEventListener('resize', size);
        if (root.parentNode) root.parentNode.removeChild(root);
      }
      var m = /Chrom(?:e|ium)\/([\d.]+)/.exec(navigator.userAgent);
      var env = 'Chromium ' + (m ? m[1] : '?') + ' | ' + location.protocol +
        ' | module: ' + ('noModule' in document.createElement('script') ? 'yes' : 'no');
      size();
      window.addEventListener('resize', size);
      add('Loading... / \u6b63\u5728\u52a0\u8f7d...');
      add(env);
      window.addEventListener('error', function (e) {
        if (started) return;
        errors++;
        var t = e.target;
        if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
          add('Failed to load: ' + (t.src || t.href));
        } else {
          var where = e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno + ':' + e.colno : '';
          add('Error: ' + (e.message || e.error) + where);
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (started) return;
        errors++;
        var r = e.reason;
        add('Unhandled rejection: ' + (r && (r.stack || r.message) || r));
      });
      window.__bootDone = function () {
        started = true;
        if (errors) setTimeout(remove, 10000);
        else remove();
      };
      setTimeout(function () {
        if (started) return;
        add('Main script did not start within 10s');
        add('Please take a photo of this screen and send it to the developer.');
      }, 10000);
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
